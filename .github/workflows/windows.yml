name: Compilar GePeGe para Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'gepege_ui.py'
      - 'gpg_backend.py'
      - 'requirements*.txt'
      - 'tests/**'
      - 'packaging/windows/**'
      - '.github/workflows/windows.yml'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Instalar dependencias
        run: python -m pip install -r requirements-build.txt
      - name: Preparar GnuPG oficial para pruebas y distribución
        shell: pwsh
        timeout-minutes: 3
        run: |
          Invoke-WebRequest -TimeoutSec 90 -Uri 'https://gnupg.org/ftp/gcrypt/binary/gnupg-w32-2.5.24_20260923.exe' -OutFile gnupg-installer.exe
          $hash = (Get-FileHash gnupg-installer.exe -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne 'ea6f9dee2cccd83287432625b8b399173805add81d27067fcaf019c0c4da1ad8') { throw 'La suma de GnuPG no coincide' }
          7z x gnupg-installer.exe "-o$env:RUNNER_TEMP\gnupg" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $gpg = "$env:RUNNER_TEMP\gnupg\bin\gpg.exe"
          & $gpg --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:RUNNER_TEMP\gnupg\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Pruebas de integración
        run: python -m unittest discover -s tests -v
      - name: Comprobar interfaz
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -c "from unittest.mock import patch; from PySide6.QtWidgets import QApplication; from app import Window; a=QApplication([]); p=patch.object(Window, 'refresh'); p.start(); w=Window(); w.show(); a.processEvents(); assert w.tabs.count()==6; p.stop()"
      - name: Crear aplicación
        run: python -m PyInstaller --noconfirm --clean --windowed --name GePeGe --add-data "packaging/GePeGe.svg;packaging" --add-data "LICENSE;." app.py
      - name: Crear instalador
        shell: pwsh
        run: |
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $nsis)) { throw 'NSIS no está disponible en el ejecutor' }
          & $nsis packaging/windows/gepege.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $name = 'GePeGe-0.2b-Windows-x86_64-Setup.exe'
          $hash = (Get-FileHash $name -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$pwd/$name.sha256", "$hash  $name`n")
      - uses: actions/upload-artifact@v4
        with:
          name: GePeGe-0.2b-Windows-x86_64
          path: |
            GePeGe-0.2b-Windows-x86_64-Setup.exe
            GePeGe-0.2b-Windows-x86_64-Setup.exe.sha256
          if-no-files-found: error
