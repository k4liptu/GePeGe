name: Comprobaciones de GePeGe

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar GPG y dependencias gráficas
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg libegl1 libgl1
      - name: Instalar dependencias de la aplicación
        run: python -m pip install -r requirements.txt
      - name: Comprobar sintaxis
        run: python -m py_compile app.py gpg_backend.py tests/test_gpg.py
      - name: Probar operaciones GPG con llaveros temporales
        run: python -m unittest discover -s tests -v
      - name: Comprobar que la ventana se crea
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python - <<'PY'
          from unittest.mock import patch
          from PySide6.QtWidgets import QApplication
          from app import Window
          app = QApplication([])
          with patch.object(Window, 'refresh'):
              window = Window()
              window.show()
              app.processEvents()
              assert window.tabs.count() == 5
              assert not window.windowIcon().isNull()
          PY
